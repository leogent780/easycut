# 스트리머별 고정영역 크롭 좌표 — 신규 스트리머를 추가할 때마다 실제 소스 영상 프레임을
# 이미지 뷰어로 열어 페이스캠/게임화면 영역의 픽셀 좌표를 1회 수동으로 기록해야 합니다.
# (§명시적 리스크/한계 — 이 부분은 완전 자동화되지 않습니다.)
#
# rect 형식: [x, y, width, height] — 소스 영상의 원본 해상도 기준 픽셀 좌표

facecam_rect: [1600, 780, 320, 240]
gameplay_crop_rect: [0, 0, 1920, 1080]
layout: facecam_top_gameplay_bottom  # 최종 9:16 캔버스에서 페이스캠을 위, 게임화면을 아래에 배치
